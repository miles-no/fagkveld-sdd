[project]
name = "fagkveld-sdd"
version = "0.1.0"
description = "Fagkveld: spec-driven development"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
# Rammeverkenes egne filer (BMAD sine skript) er ikke sporenes kode.
extend-exclude = ["**/_bmad", "**/.claude", "**/.specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Stop-hooken kjorer maleskriptene med systemets python3, som pa macOS er
# 3.9. datetime.UTC krever 3.11, sa de bruker timezone.utc med vilje.
"metrics/*.py" = ["UP017"]
